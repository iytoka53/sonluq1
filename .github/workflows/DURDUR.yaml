name: DURDUR

on:
  workflow_dispatch:   # DURDUR tusu: Actions sekmesinde "Run workflow"

permissions:
  actions: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Yayin workflow'unun tum calismalarini iptal et
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET: "24-7 Twitch Streamer"   # Yayin workflow'unun adi ile AYNI olmali
        run: |
          # 3 tur: arada son anda baslatilmis bir calisma kalirsa onu da yakalamak icin
          for round in 1 2 3; do
            echo "--- Tur $round ---"
            for status in in_progress queued waiting pending; do
              for id in $(gh run list --workflow "$TARGET" --status "$status" --limit 50 --json databaseId --jq '.[].databaseId'); do
                echo "Iptal ediliyor: $id ($status)"
                gh run cancel "$id" || true
              done
            done
            sleep 10
          done

          echo "Bitti. Kalan calisma var mi diye kontrol:"
          gh run list --workflow "$TARGET" --limit 5
