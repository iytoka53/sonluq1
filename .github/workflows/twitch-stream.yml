name: 24-7 Twitch Streamer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Her 4 saatte bir yeniden baslatir

# Ayni anda sadece 1 yayin calissin; yenisi eskisi bitince baslasin
concurrency:
  group: twitch-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download video
        env:
          VID_URL: ${{ secrets.VIDEO_URL }}
        run: curl -L --retry 5 --retry-delay 3 -o video.mp4 "$VID_URL"

      - name: Stream to Twitch (video + ses copy, encode yok)
        env:
          RTMP_URL: ${{ secrets.TWITCH_RTMP }}
        run: |
          END=$(( $(date +%s) + 14400 ))   # 4 saatlik yayin penceresi

          while [ "$(date +%s)" -lt "$END" ]; do
            REMAIN=$(( END - $(date +%s) ))
            [ "$REMAIN" -lt 10 ] && break

            echo "Yayin baslatiliyor... kalan sure: ${REMAIN} sn"
            timeout "$REMAIN" ffmpeg -hide_banner -loglevel warning \
              -re -stream_loop -1 -i video.mp4 \
              -c copy \
              -f flv "$RTMP_URL" || echo "Yayin koptu, 5 sn sonra yeniden baglaniliyor..."

            sleep 5
          done

          echo "4 saatlik pencere doldu, workflow bitiyor (yenisi cron ile baslayacak)."
