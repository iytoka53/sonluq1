name: 24-7 PRO Streamer 2 (Canli Kaynak - Copy)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *' # Her 4 saatte bir kaynaga yeniden baglanir

# Ayni anda sadece 1 yayin calissin; yenisi eskisi bitince baslasin
concurrency:
  group: pro-stream-2
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Check source (sadece bilgi icin loga yazar)
        env:
          SRC_URL: ${{ secrets.SOURCE_URL }}
        run: |
          mask() { sed -u -e 's#[A-Za-z]*://[^ ]*#[gizli]#g' -e 's/[Tt][Ww][Ii][Tt][Cc][Hh]/PRO/g' -e 's/live-video\.net/gizli/g' -e 's/contribute/gizli/g'; }

          echo "--- VIDEO ---"
          timeout 60 ffprobe -v error -rw_timeout 15000000 -select_streams v:0 \
            -show_entries stream=codec_name,profile,width,height,r_frame_rate,bit_rate \
            -of default=nw=1 "$SRC_URL" 2>&1 | mask || true

          echo "--- SES ---"
          timeout 60 ffprobe -v error -rw_timeout 15000000 -select_streams a:0 \
            -show_entries stream=codec_name,sample_rate,channels,bit_rate \
            -of default=nw=1 "$SRC_URL" 2>&1 | mask || true

          echo "--- ANAHTAR KARE (keyframe) ZAMANLARI (yaklasik 25 sn) ---"
          timeout 90 ffprobe -v error -rw_timeout 15000000 -select_streams v:0 \
            -skip_frame nokey -show_entries frame=pts_time -read_intervals "%+25" \
            -of csv=p=0 "$SRC_URL" 2>&1 | mask | head -n 12 || true

      - name: Stream PRO (kaynak -> copy, encode yok)
        env:
          SRC_URL: ${{ secrets.SOURCE_URL }}
          RTMP_URL: ${{ secrets.PRO2_RTMP }}
        run: |
          mask() { sed -u -e 's#[A-Za-z]*://[^ ]*#[gizli]#g' -e 's/[Tt][Ww][Ii][Tt][Cc][Hh]/PRO/g' -e 's/live-video\.net/gizli/g' -e 's/contribute/gizli/g'; }

          END=$(( $(date +%s) + 14400 ))   # 4 saatlik yayin penceresi

          while [ "$(date +%s)" -lt "$END" ]; do
            REMAIN=$(( END - $(date +%s) ))
            [ "$REMAIN" -lt 10 ] && break

            echo "Kaynaga baglaniliyor... kalan sure: ${REMAIN} sn"
            T0=$(date +%s)

            timeout "$REMAIN" ffmpeg -hide_banner -loglevel warning \
              -fflags +genpts \
              -reconnect 1 -reconnect_streamed 1 -reconnect_delay_max 5 -rw_timeout 15000000 \
              -i "$SRC_URL" \
              -map 0:v:0 -map 0:a:0? \
              -c copy \
              -f flv "$RTMP_URL" 2>&1 | mask

            RUN=$(( $(date +%s) - T0 ))
            if [ "$RUN" -lt 15 ]; then
              echo "Cok kisa surdu (${RUN} sn), kaynak veya hedef kapali olabilir; 20 sn sonra tekrar deneniyor..."
              sleep 20
            else
              echo "Yayin koptu, 5 sn sonra yeniden baglaniliyor..."
              sleep 5
            fi
          done

          echo "4 saatlik pencere doldu, workflow bitiyor (yenisi cron ile baslayacak)."
